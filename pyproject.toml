[project]
name = "cafe-badminton-uploader"
version = "0.1.0"
description = "Upload videos to Cafe Badminton channel"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.2",
    "google-api-python-client>=2.187.0",
    "google-auth>=2.43.0",
    "google-auth-httplib2>=0.2.1",
    "google-auth-oauthlib>=1.2.2",
    "numpy>=2.2.6",
    "opencv-python>=4.12.0.88",
    "pillow>=12.0.0",
    "python-dotenv>=1.2.1",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.9",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# Pin the rule selection explicitly so it can't silently change across ruff
# upgrades. This mirrors ruff's current defaults. The `F` group is pyflakes,
# which includes F821 (undefined name) — the check that catches missing imports
# at edit time via the PostToolUse hook in .claude/settings.json.
select = ["E4", "E7", "E9", "F"]
